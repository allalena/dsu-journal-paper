[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weedenroll"
version = "0.1.0"
description = "Offline few-shot weed recognition with field enrollment on edge devices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Abderrezak Allalen"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
onnx = ["onnx>=1.14", "onnxscript>=0.1", "onnxruntime>=1.15"]
docx = ["python-docx>=1.0"]
dev = ["pytest>=7.0", "pyarrow>=14.0"]
data = ["pyarrow>=14.0", "kaggle>=1.6", "gdown>=5.0"]

[project.scripts]
weedenroll = "weedenroll.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["weedenroll*"]
