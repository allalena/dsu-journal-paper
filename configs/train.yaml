# Train the backbone once:  weedenroll train --config configs/train.yaml
# Teacher (ResNet-50) → distilled student (MobileNetV3-Small, 128-d metric embedding).
#
# The backbone sees ONLY the base species.  `holdout_species` are excluded
# from training so they are true novel classes for the DR4 enrollment
# experiment; Plant Seedlings and CoFly are never used in training.
seed: 0
device: auto               # cuda if available
image_size: 224
out_dim: 128
batch_size: 64
num_workers: 4
log_every: 50
weights_dir: weights

data:
  root: data/deepweeds
  exclude: []               # keep "Negative" as a base class (it teaches the model what is not a weed)
  holdout_species: ["Prickly acacia", "Siam weed", "Snake weed"]
  val_frac: 0.1
  # max_images_per_class: 200     # uncomment for a quick smoke test

teacher:
  arch: resnet50
  pretrained: true          # ImageNet init (downloaded by torchvision on first use)
  epochs: 15
  lr: 0.0003
  margin: 0.2
  scale: 30.0
  # weights: weights/teacher.pt   # reuse a trained teacher

student:
  arch: mobilenet_v3_small
  pretrained: true
  epochs: 30
  lr: 0.001
  kd_weight: 1.0            # embedding distillation (cosine)
  rkd_weight: 1.0           # relational KD on batch similarity matrix
  margin: 0.2
  scale: 30.0
